[project]
name = "ai-swe-agent"
version = "0.1.0"
description = "An AI Software Engineer orchestrated over the Model Context Protocol (MCP)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI SWE Agent Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "mcp>=1.2.0",
    "gitpython>=3.1.43",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
    # Capped below 0.26: newer tree-sitter core segfaults against the
    # tree-sitter-<lang> 0.23-0.25 grammar wheels below (ABI mismatch).
    "tree-sitter>=0.23.0,<0.26.0",
    "networkx>=3.3",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
ai-swe = "ai_swe.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_swe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# `typer.Argument(...)` / `typer.Option(...)` as a parameter default is the
# idiomatic Typer CLI pattern (see `cli/main.py`), not the mutable-default
# footgun B008 targets.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
